name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Semanal, segunda-feira às 04:30 UTC (horário de baixo tráfego, fora do horário cheio do
    # topo da hora, como a doc do GitHub recomenda para cron de Actions).
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    # security-events: write fica no job, não no topo: é o que grava o resultado em Security >
    # Code scanning (exigido pela doc do CodeQL), e no topo o Scorecard tira ponto em
    # Token-Permissions. packages: read do template oficial fica de fora (só serve para CodeQL
    # packs privados).
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # JavaScript/TypeScript é analisado a partir do código-fonte: não há compilação para
          # rodar, então o modo de build correto é "none" (o único suportado para esta linguagem).
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
