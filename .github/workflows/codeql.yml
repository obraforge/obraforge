name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Semanal, segunda-feira às 04:30 UTC (horário de baixo tráfego, fora do horário cheio do
    # topo da hora, como a doc do GitHub recomenda para cron de Actions).
    - cron: '30 4 * * 1'

permissions:
  # security-events: write é exigido pela própria doc do CodeQL ("required for all workflows") —
  # é o que grava o resultado da análise em Security > Code scanning. contents: read é o mínimo
  # para o checkout; o template oficial (actions/starter-workflows) marca os dois como "only
  # required for private repositories", porque um repositório público pode ser clonado sem
  # permissão nenhuma do GITHUB_TOKEN — mas declarar contents: read aqui não pede nada a mais do
  # que o resto dos workflows do repositório já pede, e deixa o bloco autoexplicativo.
  # packages: read (do template) fica de fora: só é preciso para buscar CodeQL packs privados, e
  # este repositório não usa nenhum.
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          # JavaScript/TypeScript é analisado a partir do código-fonte: não há compilação para
          # rodar, então o modo de build correto é "none" (o único suportado para esta linguagem).
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
